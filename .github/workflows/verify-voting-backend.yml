name: Verify Drive photo voting backend
on:
  push:
    paths:
      - '.github/workflows/verify-voting-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Google Apps Script CORS and Drive photos
        shell: bash
        env:
          GAS_URL: https://script.google.com/macros/s/AKfycbypWbMzRlnjx1W0kTeVF0UZV85ZLUKxpHgNyEAg3mh4WEqfvgGf8jWMvt5VVBO79ABVdQ/exec
        run: |
          python3 - <<'PY'
          import os, json, sys, urllib.request, urllib.error, urllib.parse
          URL=os.environ["GAS_URL"]
          ORIGIN="https://26msy0524.github.io"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def probe(url, body=None):
              req=urllib.request.Request(url,data=body,headers={"Origin":ORIGIN,"Content-Type":"text/plain;charset=UTF-8","User-Agent":"Mozilla/5.0"})
              try:
                  urllib.request.build_opener(NoRedirect).open(req,timeout=35)
                  first_status=200
                  first_cors="*"
              except urllib.error.HTTPError as e:
                  first_status=e.code
                  first_cors=e.headers.get("Access-Control-Allow-Origin")
              with urllib.request.urlopen(req,timeout=35) as f:
                  final_status=f.status
                  final_cors=f.headers.get("Access-Control-Allow-Origin")
                  content_type=f.headers.get("Content-Type","")
                  payload=f.read(3000000).decode("utf-8")
              print("Request",("POST" if body is not None else "GET"),"redirect",first_status,"CORS",first_cors,"final",final_status,"CORS",final_cors)
              if first_status != 302 or first_cors not in ("*",ORIGIN) or final_status!=200 or final_cors not in ("*",ORIGIN):
                  raise RuntimeError("Browser CORS requirements not met")
              return json.loads(payload)
          try:
              images=probe(URL+"?action=images")
              assert images.get("result")=="success", str(images.get("message"))[:180]
              counts=[]
              for i in range(1,8):
                  entries=images.get("data",{}).get("session"+str(i),[])
                  counts.append(len(entries))
                  if not entries: raise RuntimeError("Session "+str(i)+" contains no images")
                  url=entries[0]["url"]
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as res:
                      typ=res.headers.get("Content-Type","")
                      if res.status!=200 or not typ.startswith("image/"):
                          raise RuntimeError("Session "+str(i)+" image unavailable")
              print("Drive session image counts:",counts)
              error_response=probe(URL,body=b'{"malformed":')
              if error_response.get("result")!="error":
                  raise RuntimeError("Malformed POST should produce safe error, got "+str(error_response.get("result")))
              print("PASS: Direct cross-origin JSON GET + POST errors are readable; Drive images public; live success/duplicate separately verified.")
          except Exception as e:
              print("FAIL:",str(e))
              sys.exit(1)
          PY
