<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#273e71">
  <meta name="description" content="2026 세션별 사진 투표 - 7개 세션에서 사진을 하나씩 선택하세요.">
  <title>2026 사진 투표 | 세션별 작품 선택</title>
  <style>
    :root { color-scheme:light; --ink:#182b4b; --muted:#62728b; --primary:#3458b7; --primary-dark:#213f92; --tint:#eef3ff; --bg:#f6f8fc; --stroke:#e3e8f2; --danger:#b52c42; --success:#187453; --shadow:0 12px 35px rgba(25,42,79,.09); }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6} button,input{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.45} button:focus-visible,input:focus-visible{outline:3px solid #f5b744;outline-offset:3px}
    .wrap{width:min(1120px,calc(100% - 36px));margin:0 auto} .hero{background:linear-gradient(122deg,#233e79,#4572cf);color:white;padding:45px 0 55px;position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff33;border-radius:50%;width:360px;height:360px;right:-120px;top:-150px}.hero:after{width:260px;height:260px;top:auto;right:20%;bottom:-185px}.eyebrow{display:inline-block;border:1px solid #ffffff55;border-radius:999px;padding:3px 12px;font-size:12px;letter-spacing:.1em;font-weight:700}.hero h1{font-size:clamp(30px,4vw,48px);letter-spacing:-.05em;line-height:1.25;margin:16px 0 8px}.hero p{margin:0;opacity:.91;font-size:15px}
    main{margin:-24px auto 70px;position:relative}.panel{border:1px solid var(--stroke);border-radius:20px;background:#fff;box-shadow:var(--shadow);padding:24px;margin-bottom:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.label{font-weight:800}.muted{color:var(--muted)}.small{font-size:13px}.progress-track{height:9px;border-radius:999px;background:#e9effb;overflow:hidden;margin:14px 0 7px}.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#4166ce,#6a9df9);transition:width .25s}.session-tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin-top:20px}.session-tab{border:1px solid #d9e2f3;border-radius:12px;padding:11px 4px;color:var(--muted);background:#f9fbff;font-size:14px;font-weight:700;white-space:nowrap}.session-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}.session-tab.done:not(.active){color:var(--success);background:#edf9f3;border-color:#bce7d2}
    .section-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin:0 0 20px}.section-top h2{margin:0;font-size:25px;letter-spacing:-.04em}.chip{background:var(--tint);border-radius:999px;padding:5px 12px;color:var(--primary-dark);font-weight:750;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:16px}.photo-card{border:2px solid var(--stroke);border-radius:15px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;background:white;min-width:0;text-align:left;padding:0;transition:transform .12s,border-color .12s,box-shadow .12s}.photo-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #24345314}.photo-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px #3458b71e}.photo-wrap{width:100%;aspect-ratio:4/3;background:#f2f5fa;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo-wrap img{width:100%;height:100%;object-fit:contain}.photo-error{padding:20px;font-size:13px;color:var(--muted);text-align:center}.photo-meta{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.photo-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.checkmark{height:23px;width:23px;border:2px solid #bac7da;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;color:transparent}.selected .checkmark{border-color:var(--primary);background:var(--primary);color:white}
    .actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;border-top:1px solid var(--stroke);padding-top:20px}.btn{border:0;border-radius:12px;background:var(--primary);color:white;padding:12px 19px;font-weight:750;min-height:46px}.btn:hover:not(:disabled){background:var(--primary-dark)}.btn.secondary{background:white;color:var(--ink);border:1px solid #cbd5e5}.btn.secondary:hover:not(:disabled){background:#f5f7fa}.notice{margin:0 0 18px;padding:13px 15px;border-radius:12px;background:#eff4fc;color:#344d7a;font-size:14px}.notice.error{background:#fff0f2;color:var(--danger)}.notice.ok{background:#e7f7ef;color:var(--success)}.hidden{display:none!important}.empty{padding:52px 18px;text-align:center;background:#f8fafd;border:1px dashed #c9d4e6;border-radius:14px;color:var(--muted)}.steps{color:var(--muted);font-size:13px}.footer{text-align:center;font-size:12px;color:#8490a3;margin-top:30px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(12,24,52,.56);display:grid;place-items:center;padding:18px;z-index:50}.modal{background:white;width:min(530px,100%);border-radius:19px;box-shadow:0 18px 55px #0004;padding:26px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 8px;font-size:23px}.summary-list{list-style:none;padding:0;margin:16px 0 23px;border-top:1px solid var(--stroke)}.summary-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--stroke);font-size:14px}.summary-list strong{flex:none}.summary-list span{text-align:right;overflow-wrap:anywhere}.field-label{font-weight:800;font-size:14px;display:block;margin:0 0 7px}.field{width:100%;border:1px solid #c4cee0;border-radius:11px;padding:12px 13px;background:white}.form-hint{color:var(--muted);font-size:12px;margin:7px 0 15px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.complete{text-align:center;padding:30px 15px}.complete .symbol{font-size:50px;line-height:1.2}.complete h2{font-size:26px}.complete p{color:var(--muted)}
    @media(max-width:650px){.hero{padding:35px 0 48px}.panel{padding:18px;border-radius:16px}.session-tabs{gap:4px}.session-tab{font-size:12px;padding:9px 0;border-radius:8px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-meta{padding:10px}.photo-name{font-size:12px}.section-top h2{font-size:22px}.btn{padding:11px 14px}.modal{padding:19px}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><span class="eyebrow">2026 · PHOTO VOTE</span><h1>마음에 드는 사진을<br>선택해 주세요</h1><p>7개 세션에서 사진을 한 장씩 선택한 후 투표를 완료하세요.</p></div></header>
  <main class="wrap">
    <section class="panel" aria-label="투표 진행 상황"><div class="row"><span class="label">나의 투표 진행 상황</span><span class="muted small" id="progressLabel">0 / 7 세션 완료</span></div><div class="progress-track" role="progressbar" aria-label="투표 진행률" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0" id="progressBar"><div class="progress-fill" id="progressFill"></div></div><nav class="session-tabs" id="tabs" aria-label="세션 이동"></nav></section>
    <section class="panel" id="votePanel"><div class="section-top"><div><p class="steps" id="stepLabel">SESSION 01 / 07</p><h2 id="sessionTitle">세션 1 사진 선택</h2></div><span class="chip">1개 선택</span></div><p class="notice" id="notice" role="status">사진 목록을 불러오는 중입니다.</p><div class="cards" id="cards" aria-live="polite"></div><div class="actions"><button type="button" class="btn secondary" id="prevButton">← 이전 세션</button><button type="button" class="btn" id="nextButton">다음 세션 →</button></div></section>
    <p class="footer">선택한 사진은 최종 제출 전까지 바꿀 수 있습니다. 제출 후에는 수정할 수 없습니다.</p>
  </main>
  <div id="modalBackdrop" class="modal-backdrop hidden" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle"><h2 id="reviewTitle">최종 투표 확인</h2><p class="muted small">7개 세션의 선택을 확인하고 참가자 번호를 입력하세요.</p><ul class="summary-list" id="summaryList"></ul><form id="voteForm"><label for="voterId" class="field-label">참가자 번호</label><input id="voterId" class="field" type="text" maxlength="40" autocomplete="off" pattern="[A-Za-z0-9_-]+" required placeholder="배부받은 참가자 번호 입력"><p class="form-hint">참가자 번호로 중복 투표를 확인합니다. 이름이나 민감한 개인정보는 입력하지 마세요.</p><p class="notice hidden" id="submitNotice" role="alert"></p><div class="modal-actions"><button type="button" class="btn secondary" id="cancelButton">선택 수정</button><button type="submit" class="btn" id="submitButton">최종 투표 제출</button></div></form></div></div>
  <script>
  'use strict';
  // ★ 배포한 Google Apps Script의 '/exec' 주소를 따옴표 사이에 넣으세요.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypWbMzRlnjx1W0kTeVF0UZV85ZLUKxpHgNyEAg3mh4WEqfvgGf8jWMvt5VVBO79ABVdQ/exec';
  const NUM_SESSIONS = 7;
  const sessionData = Array.from({length: NUM_SESSIONS}, () => []);
  const chosen = Array(NUM_SESSIONS).fill(null);
  let current = 0;
  let busy = false;
  const el = id => document.getElementById(id);
  const configured = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(APPS_SCRIPT_URL);

  function message(text, type = '') {
    const node = el('notice'); node.textContent = text; node.className = 'notice' + (type ? ' ' + type : '');
  }
  function submitMessage(text, type = '') {
    const node = el('submitNotice'); node.textContent = text; node.className = 'notice' + (type ? ' ' + type : '');
  }
  async function getBackendJson(params = {}) {
    if (!configured) throw new Error('Google Apps Script 웹 앱 주소가 설정되지 않았습니다.');
    const url = new URL(APPS_SCRIPT_URL);
    Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, String(value)));
    url.searchParams.set('_', String(Date.now()));
    const response = await fetch(url.toString(), {
      method: 'GET', mode: 'cors', redirect: 'follow', cache: 'no-store'
    });
    if (!response.ok) throw new Error('사진 서버 HTTP ' + response.status + ' 오류');
    try { return await response.json(); }
    catch (_) { throw new Error('사진 서버 응답이 JSON 형식이 아닙니다.'); }
  }
  async function loadPhotos() {
    if (!configured) {
      message('운영자 설정이 필요합니다. index.html의 APPS_SCRIPT_URL에 배포된 웹 앱 주소를 입력해 주세요.', 'error');
      render(); return;
    }
    try {
      const response = await getBackendJson({action:'images'});
      if (response.result !== 'success') throw new Error(response.message || '사진 목록을 읽지 못했습니다.');
      for (let i = 0; i < NUM_SESSIONS; i++) {
        const data = response.data?.['session' + (i + 1)];
        sessionData[i] = Array.isArray(data) ? data.filter(item => item && item.id && item.url) : [];
      }
      message('마음에 드는 사진을 선택하면 자동으로 다음 단계로 이동할 수 있습니다.');
    } catch (err) {message('사진을 불러오지 못했습니다. ' + err.message, 'error');}
    render();
  }
  function render() {
    const completed = chosen.filter(Boolean).length;
    el('progressLabel').textContent = completed + ' / 7 세션 완료';
    el('progressFill').style.width = (completed / NUM_SESSIONS * 100) + '%';
    el('progressBar').setAttribute('aria-valuenow', String(completed));
    el('stepLabel').textContent = 'SESSION ' + String(current + 1).padStart(2, '0') + ' / 07';
    el('sessionTitle').textContent = '세션 ' + (current + 1) + ' 사진 선택';
    const tabs = el('tabs'); tabs.replaceChildren();
    for (let i = 0; i < NUM_SESSIONS; i++) {
      const tab = document.createElement('button');tab.type = 'button';
      tab.textContent = String(i + 1) + (chosen[i] ? ' ✓' : '');
      tab.className = 'session-tab' + (current === i ? ' active' : '') + (chosen[i] ? ' done' : '');
      tab.setAttribute('aria-label', (i + 1) + '번 세션' + (chosen[i] ? ' 선택 완료' : ''));
      tab.setAttribute('aria-current', current === i ? 'step' : 'false');
      tab.addEventListener('click', () => {current = i; render();});
      tabs.append(tab);
    }
    const cards = el('cards'); cards.replaceChildren();
    if (sessionData[current].length === 0) {
      const empty = document.createElement('div');empty.className = 'empty';
      empty.textContent = configured ? '이 세션에는 표시할 사진이 없습니다. 운영자에게 확인해 주세요.' : '웹 앱 주소를 연결하면 사진이 이곳에 표시됩니다.';
      empty.style.gridColumn = '1 / -1';cards.append(empty);
    }
    sessionData[current].forEach((photo, index) => {
      const btn = document.createElement('button'); btn.type = 'button';
      const selected = chosen[current]?.id === photo.id;
      btn.className = 'photo-card' + (selected ? ' selected' : '');
      btn.setAttribute('aria-pressed', String(selected));
      btn.setAttribute('aria-label', (photo.name || (index+1)+'번 사진') + (selected ? ' 선택됨' : ' 선택하기'));
      const picture = document.createElement('div');picture.className = 'photo-wrap';
      const img = document.createElement('img');img.src = photo.url;img.loading = 'lazy';
      img.alt = photo.name || ('세션 '+(current+1)+' '+(index+1)+'번 사진');
      img.onerror = () => {picture.replaceChildren();const err = document.createElement('span');err.className = 'photo-error';err.textContent='이미지를 표시할 수 없습니다. 사진 공유 권한을 확인하세요.';picture.append(err);};
      picture.append(img);
      const meta = document.createElement('div'); meta.className = 'photo-meta';
      const name = document.createElement('span');name.className = 'photo-name';name.textContent = photo.name || '사진 '+(index+1);
      const check = document.createElement('span');check.className='checkmark';check.setAttribute('aria-hidden','true');check.textContent='✓';
      meta.append(name,check);btn.append(picture,meta);
      btn.addEventListener('click', () => {chosen[current] = photo;render();}); cards.append(btn);
    });
    el('prevButton').disabled = current === 0;
    el('nextButton').textContent = current === NUM_SESSIONS - 1 ? '투표 내용 확인 ✓' : '다음 세션 →';
  }
  function next() {
    if (current < NUM_SESSIONS - 1) {current++;render();window.scrollTo({top:0,behavior:'smooth'});return;}
    const firstMissing = chosen.findIndex(x => !x);
    if (firstMissing !== -1) {current = firstMissing;render();message('모든 세션에서 사진을 한 장씩 선택해 주세요.', 'error');return;}
    el('summaryList').replaceChildren();
    chosen.forEach((photo, i) => {
      const row = document.createElement('li');const label = document.createElement('strong');const value = document.createElement('span');
      label.textContent = '세션 ' + (i + 1);value.textContent = photo.name || photo.id;
      row.append(label,value);el('summaryList').append(row);
    });
    el('submitNotice').classList.add('hidden');el('modalBackdrop').classList.remove('hidden');el('voterId').focus();
  }
  function closeReview() {if(busy)return;el('modalBackdrop').classList.add('hidden');}
  async function sendVote(event) {
    event.preventDefault();if(busy)return;
    const voterId = el('voterId').value.trim();
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(voterId)) {submitMessage('참가자 번호는 영문, 숫자, 하이픈(-), 밑줄(_)로 1~40자 입력해 주세요.','error');return;}
    if (chosen.some(x => !x)) {submitMessage('7개 세션 모두 선택해 주세요.','error');return;}
    if (!configured) {submitMessage('웹 앱 주소가 설정되지 않았습니다.','error');return;}
    busy = true;el('submitButton').disabled = true;el('cancelButton').disabled = true;
    submitMessage('투표를 저장하고 결과를 확인하고 있습니다. 창을 닫지 마세요.');
    const receipt = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST', mode: 'cors', redirect: 'follow', cache: 'no-store',
        headers: {'Content-Type':'text/plain;charset=UTF-8'},
        body: JSON.stringify({voterId, receipt, selections: chosen.map(x => x.id)})
      });
      if (!response.ok) throw new Error('투표 서버 HTTP ' + response.status + ' 오류');
      let result;
      try { result = await response.json(); }
      catch (_) { throw new Error('서버의 투표 응답을 확인할 수 없습니다.'); }
      if (result.result === 'duplicate') {
        submitMessage('이미 투표에 참여한 번호입니다. 중복 투표는 허용되지 않습니다.', 'error');
        return;
      }
      if (result.result !== 'success') {
        throw new Error(result.message || '투표 저장에 실패했습니다. 운영자에게 문의해 주세요.');
      }
      el('modalBackdrop').classList.add('hidden');
      el('tabs').closest('.panel').classList.add('hidden');
      const panel = el('votePanel');panel.replaceChildren();panel.className='panel complete';
      const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent='✅';
      const heading=document.createElement('h2');heading.textContent='투표가 완료되었습니다!';
      const info=document.createElement('p');info.textContent='7개 세션의 선택 결과가 정상적으로 저장되었습니다.';
      panel.append(symbol,heading,info);window.scrollTo({top:0,behavior:'smooth'});
    } catch(err) {submitMessage(err.message,'error');}
    finally {busy = false;el('submitButton').disabled = false;el('cancelButton').disabled = false;}
  }
  el('prevButton').addEventListener('click',() => {if(current>0){current--;render();}});
  el('nextButton').addEventListener('click',next);
  el('cancelButton').addEventListener('click',closeReview);
  el('voteForm').addEventListener('submit',sendVote);
  render();loadPhotos();
  </script>
</body>
</html>
